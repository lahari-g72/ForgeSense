name: ForgeSense CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Backend Docker Image
      run: docker build -t forgesense-backend:latest .

    - name: Build Frontend Docker Image
      run: |
        cd forgesense-ui
        docker build -t forgesense-frontend:latest .
        
    - name: Verify Builds
      run: |
        docker images
        echo "✅ CI/CD Pipeline successfully built frontend and backend containers."