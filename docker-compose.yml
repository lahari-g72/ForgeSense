version: '3.8'

services:
  backend:
    build: .
    container_name: forgesense-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build: ./forgesense-ui
    container_name: forgesense-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always